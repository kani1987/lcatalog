<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-left">
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            <h1 class="logo">订单管理系统</h1>
        </div>
        <div class="header-right">
            <div class="search-box">
                <input type="text" placeholder="搜索订单..." id="globalSearch">
                <i class="fas fa-search"></i>
            </div>
            <div class="user-menu">
                <img src="https://via.placeholder.com/32x32" alt="用户头像" class="user-avatar">
                <span class="user-name">管理员</span>
                <i class="fas fa-chevron-down"></i>
            </div>
        </div>
    </header>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <ul>
                <li class="nav-item active">
                    <a href="#" class="nav-link" data-page="list">
                        <i class="fas fa-list"></i>
                        <span>订单列表</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-page="edit">
                        <i class="fas fa-plus"></i>
                        <span>新建订单</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-chart-bar"></i>
                        <span>统计报表</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-users"></i>
                        <span>客户管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-cog"></i>
                        <span>系统设置</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 订单列表页面 -->
        <div class="page" id="listPage">
            <div class="page-header">
                <h2>订单列表</h2>
                <div class="page-actions">
                    <button class="btn btn-primary" data-page="edit">
                        <i class="fas fa-plus"></i>
                        新建订单
                    </button>
                    <button class="btn btn-secondary">
                        <i class="fas fa-download"></i>
                        导出
                    </button>
                </div>
            </div>

            <!-- 筛选器 -->
            <div class="filters">
                <div class="filter-group">
                    <label>状态:</label>
                    <select id="statusFilter">
                        <option value="">全部</option>
                        <option value="pending">待处理</option>
                        <option value="processing">处理中</option>
                        <option value="shipped">已发货</option>
                        <option value="delivered">已送达</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>日期范围:</label>
                    <input type="date" id="startDate">
                    <span>至</span>
                    <input type="date" id="endDate">
                </div>
                <div class="filter-group">
                    <label>金额范围:</label>
                    <input type="number" placeholder="最小金额" id="minAmount">
                    <span>-</span>
                    <input type="number" placeholder="最大金额" id="maxAmount">
                </div>
                <button class="btn btn-primary" id="applyFilters">筛选</button>
                <button class="btn btn-secondary" id="resetFilters">重置</button>
            </div>

            <!-- 订单表格 -->
            <div class="table-container">
                <table class="orders-table" id="ordersTable">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th class="sortable" data-field="orderNumber">订单号</th>
                            <th class="sortable" data-field="customerName">客户</th>
                            <th class="sortable" data-field="productName">商品</th>
                            <th>数量</th>
                            <th>单价</th>
                            <th class="sortable" data-field="totalAmount">总额</th>
                            <th class="sortable" data-field="status">状态</th>
                            <th class="sortable" data-field="orderDate">下单时间</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- 动态生成的订单数据 -->
                    </tbody>
                </table>
            </div>

            <!-- 分页 -->
            <div class="pagination">
                <div class="pagination-info">
                    共 <span id="totalRecords">0</span> 条记录，第 <span id="currentPage">1</span> 页，共 <span id="totalPages">1</span> 页
                </div>
                <div class="pagination-controls">
                    <button class="btn btn-secondary" id="prevPage">上一页</button>
                    <div class="page-numbers" id="pageNumbers"></div>
                    <button class="btn btn-secondary" id="nextPage">下一页</button>
                </div>
            </div>
        </div>

        <!-- 订单编辑页面 -->
        <div class="page hidden" id="editPage">
            <div class="page-header">
                <h2 id="editTitle">新建订单</h2>
                <div class="page-actions">
                    <button class="btn btn-primary" id="saveOrder">
                        <i class="fas fa-save"></i>
                        保存
                    </button>
                    <button class="btn btn-secondary" data-page="list">
                        <i class="fas fa-arrow-left"></i>
                        返回列表
                    </button>
                </div>
            </div>

            <div class="edit-form">
                <form id="orderForm">
                    <div class="form-section">
                        <h3>基本信息</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="orderNumber">订单号 *</label>
                                <input type="text" id="orderNumber" name="orderNumber" required readonly>
                            </div>
                            <div class="form-group">
                                <label for="orderDate">下单日期 *</label>
                                <input type="datetime-local" id="orderDate" name="orderDate" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>客户信息</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="customerName">客户姓名 *</label>
                                <input type="text" id="customerName" name="customerName" required>
                            </div>
                            <div class="form-group">
                                <label for="customerPhone">联系电话 *</label>
                                <input type="tel" id="customerPhone" name="customerPhone" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="customerAddress">收货地址 *</label>
                                <textarea id="customerAddress" name="customerAddress" required rows="2"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>商品信息</h3>
                        <div class="products-container">
                            <div class="product-item">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="productName">商品名称 *</label>
                                        <input type="text" id="productName" name="productName" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="productPrice">单价 *</label>
                                        <input type="number" id="productPrice" name="productPrice" step="0.01" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="productQuantity">数量 *</label>
                                        <input type="number" id="productQuantity" name="productQuantity" min="1" required>
                                    </div>
                                    <div class="form-group">
                                        <label>小计</label>
                                        <input type="text" id="productSubtotal" readonly>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary" id="addProduct">
                            <i class="fas fa-plus"></i>
                            添加商品
                        </button>
                    </div>

                    <div class="form-section">
                        <h3>订单详情</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="orderStatus">订单状态 *</label>
                                <select id="orderStatus" name="orderStatus" required>
                                    <option value="pending">待处理</option>
                                    <option value="processing">处理中</option>
                                    <option value="shipped">已发货</option>
                                    <option value="delivered">已送达</option>
                                    <option value="cancelled">已取消</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="totalAmount">订单总额</label>
                                <input type="text" id="totalAmount" name="totalAmount" readonly>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="orderNotes">备注</label>
                                <textarea id="orderNotes" name="orderNotes" rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
